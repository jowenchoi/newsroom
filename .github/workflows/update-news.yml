name: Update news

# No schedule: runs only when the site's refresh button (or "Run workflow") asks for it.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLM SDKs (used only when an API key secret is set)
        run: pip install anthropic openai

      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/fetch_news.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update news $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # main may have moved while we were collecting (e.g. a site edit); replay on top.
          git pull --rebase origin main
          git push
